<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprova+ ENEM — Inscrição</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="signup-page">

    <header class="site-header compact-header">
        <a class="brand" href="index.html" aria-label="Aprova+ ENEM">
            <span class="brand-mark">+</span>
            <span>
                <strong>Aprova+</strong>
                <small>ENEM 2026</small>
            </span>
        </a>

        <span class="secure-label">Inscrição</span>
    </header>

    <main class="signup-main">
        <section class="signup-card">
            <div class="signup-badge">ENEM<br>2026</div>

            <h1>Crie seu acesso</h1>
            <p class="signup-subtitle">
                Informe seus dados básicos para continuar para o preparatório.
            </p>

            <form id="signupForm">
                <label for="name">Nome</label>
                <input id="name" name="name" type="text" placeholder="Digite seu nome" autocomplete="on" required>

                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="Digite seu e-mail" autocomplete="on" required>

                <button class="main-cta full-button" type="submit">
                    Continuar
                </button>
            </form>
        </section>
    </main>

    <script>
        const form = document.getElementById("signupForm");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            /*
             * SIMULAÇÃO EDUCATIVA:
             * Os valores dos campos não são lidos, armazenados,
             * enviados para servidor ou usados para autenticação.
             */
            window.location.href = "resultado.html";
        });
    </script>
    <footer class="site-footer">
        <strong>Aprova+ ENEM</strong>
        <span>&copy;2026 Todos os direitos reservados</span>
    </footer>
</body>

</html>
